  # ---------------------------------------------------------- SQLITE DATABASES
  # Copied via SQLite's backup API, never byte-for-byte off a live file.
  # Listed by explicit path — not every .db file is SQLite.
  # erf's 4 live, actively-written (WAL mode) databases confirmed 2026-08-19
  # per Daniel's ruling: "protect it, but enforce SQLite-safe backup for live
  # DB files regardless of Git classification." Runner._backup_sqlite routes
  # these through sqlite3's own .backup() online-backup API (see runner.py),
  # not a raw filesystem copy -- these are also excluded from git_rescue's
  # per-file walk of erf/ so they're never double-handled (raw copy + proper
  # backup of the same file).
  # archive/catalog_20260202T132929Z/catalog_full/*.db and catalog/*.db were
  # seen during inventory but not verified as live/in-use (vs. static/archived
  # copies, which need no live-snapshot handling) -- left out, still open.
  sqlite_databases:
