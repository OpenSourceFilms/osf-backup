# OSF Selective Backup — policy
#
# Path rules are LONGEST-PREFIX-WINS and are relative to source.root.
# Precedence (highest first) is enforced in app/policy.py:
#   hard exclusion > .backup-never > .backup-always > path rules
#   > git classification > output budget > unclassified
#
# NOTE: the `paths:` arrays below are DERIVED FROM THE ACTUAL INVENTORY SCAN
# (see reports/). They are not guesses. Anything not matched here falls through
# to UNCLASSIFIED and is reported, never silently included or dropped.

version: 1

source:
  root: /workspace

target:
  bucket: v6a4zjiytb
  endpoint: https://s3api-eu-ro-1.runpod.io
  region: EU-RO-1
  prefix: _osf_backup
  capacity_bytes: 300000000000   # 300 GB nominal (RunPod decimal GB; ~279.4 GiB
                                  # actual). Resized 2026-08-19 from the original
                                  # 100 GB per the corrected sizing audit -- see
                                  # HANDOFF.md / the volume-sizing conversation.

settling:
  minimum_age_seconds: 600       # a file touched more recently is DEFERRED_ACTIVE

storage:
  warning_fraction: 0.70
  discretionary_stop_fraction: 0.80
  hard_stop_fraction: 0.90

outputs:
  # Capacity-control caps removed 2026-08-17 (Daniel): the backup volume must be
  # sized FROM the measured natural protected set, not the other way around.
  # max_file_bytes is kept as a review signal, not a capacity mechanism -- a
  # rejection here means "flag this one exceptionally large item for the
  # OVERSIZE REVIEW", not "trim to fit 100 GB".
  max_file_bytes: 4294967296     # 4 GiB - oversize-review flag, not a budget
  max_root_bytes: null           # was 12 GiB - removed as a capacity control
  max_total_bytes: null          # was 25 GiB - removed as a capacity control
  selection: newest_first

retention:
  daily: 14
  weekly: 8
  # Trimmed 6->4 on 2026-08-19 to match the 250 GB volume's modeled capacity.
  # 6 monthly (~180d horizon) needed ~242 GiB at the Recommended tier (250 GB
  # volume only has ~233 GiB); 4 monthly (~120d horizon) needs ~218 GiB,
  # which fits with ~15 GiB margin -- thinner than the original 90-day
  # estimate suggested, so re-check this once real snapshot history exists
  # rather than treating it as permanently settled.
  monthly: 4
  unreferenced_blob_grace_days: 30

verification:
  daily_sample_max_bytes: 268435456    # 256 MiB
  weekly_sample_max_bytes: 2147483648  # 2 GiB

git:
  mode: rescue_if_not_proven_remote
  mutate_repositories: false
  include_untracked_nonignored: true
  uncertain_repo_action: full_backup

markers:
  always: .backup-always
  never: .backup-never

healthcheck:
  # Value comes from env BACKUP_HEALTHCHECK_URL only. Never stored here —
  # the Healthchecks secret lives in the URL path.
  env_var: BACKUP_HEALTHCHECK_URL
  timeout_seconds: 15

