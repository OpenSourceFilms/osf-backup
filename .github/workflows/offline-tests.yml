name: Historical backup offline regression tests

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "tests/**"
      - "config/**"
      - "requirements.lock.txt"
      - "pytest.ini"
      - "README.md"
      - ".github/workflows/offline-tests.yml"
      - ".github/offlineguard/**"
  pull_request:
  workflow_dispatch:

# Never provide service credentials. No backup, restore or network operations.
permissions:
  contents: read

concurrency:
  group: backup-offline-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      AWS_EC2_METADATA_DISABLED: "true"
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
      PYTHONPATH: ".github/offlineguard"
      GIT_TERMINAL_PROMPT: "0"
    steps:
      - name: Checkout public source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Pin Python 3.11
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.11"
      - name: Install locked Python requirements
        run: python -m pip install --disable-pip-version-check -r requirements.lock.txt
      - name: Assert test network guard is active
        run: |
          python -B - <<'PY'
          import socket
          for family, address in (
              (socket.AF_INET, ("127.0.0.1", 9)),
              (socket.AF_INET6, ("::1", 9)),
          ):
              sock = socket.socket(family, socket.SOCK_STREAM)
              try:
                  sock.connect(address)
              except OSError as exc:
                  assert "OFFLINE_TEST_BLOCKED_NETWORK" in str(exc), str(exc)
              else:
                  raise AssertionError("IP socket connection was not blocked")
              finally:
                  sock.close()
          PY
      - name: Run non-live backup regression tests
        run: python -B -m pytest -q -m 'not live' --disable-warnings
